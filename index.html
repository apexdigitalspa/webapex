<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexDigital | Ingeniería de Software, Páginas Web y Apps Móviles para Empresas</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Firma de desarrollo de software a medida, páginas web corporativas y aplicaciones móviles (Web + App sincronizadas) para empresas en Chile. Puerto Montt, Chile.">
  <meta name="keywords" content="desarrollo de software chile, paginas web empresas, apps moviles chile, sistemas web a medida, ingenieria informatica, apexdigital, puerto montt">
  <meta name="author" content="ApexDigital">
  
  <!-- Open Graph / Social Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://apexdigital.cl/">
  <meta property="og:title" content="ApexDigital | Soluciones Digitales e Ingeniería de Software">
  <meta property="og:description" content="Transformamos requerimientos complejos en plataformas web, sistemas de gestión y aplicaciones móviles sincronizadas para potenciar empresas en Chile.">
  <meta property="og:image" content="/brand-banner.jpg">

  <!-- Favicon Oficial AD Metálico -->
  <link rel="icon" type="image/png" href="/favicon-ad.png?v=4">
  <link rel="apple-touch-icon" href="/favicon-ad.png?v=4">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS configurado con la paleta Acero, Plata y Azul Marino Imperial del Logo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            apex: {
              navy: '#0F172A',      /* Azul marino profundo corporativo */
              imperial: '#1E3A5F',  /* Azul acero imperial del interior del logo AD */
              steel: '#334155',     /* Gris acero oscuro */
              silver: '#94A3B8',    /* Plata metálico */
              platinum: '#F1F5F9',  /* Fondo platino claro */
              surface: '#F8FAFC'    /* Blanco humo */
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased selection:bg-[#1E3A5F] selection:text-white overflow-x-hidden">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
